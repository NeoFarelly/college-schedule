name: Parse schedule data

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus

      - run: cd tools && npm install --no-audit --no-fund

      - run: node tools/fetch-sources.mjs

      - run: |
          pdftoppm -png -r 200 -f 1 -l 1 sources/bells.pdf sources/bells
          tesseract sources/bells-1.png sources/bells-ocr -l rus

      - run: node tools/parse.mjs
        if: hashFiles('tools/parse.mjs') != ''

      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: sources/

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update schedule data" && git push)
        if: hashFiles('tools/parse.mjs') != ''